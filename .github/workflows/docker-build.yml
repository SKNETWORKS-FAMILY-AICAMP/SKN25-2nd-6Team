name: Docker Build & Push

on:
  push:
    branches: [integrate, main]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: chany0812

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Backend (FastAPI + AI) ──────────────────────────────────────
      - name: Build & Push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ai/docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/medipaw-backend:latest
            ${{ env.IMAGE_PREFIX }}/medipaw-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Guardian Frontend ───────────────────────────────────────────
      - name: Build & Push guardian
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ai/docker/Dockerfile.guardian
          push: true
          build-args: |
            VITE_API_BASE_URL=http://localhost:8000
          tags: |
            ${{ env.IMAGE_PREFIX }}/medipaw-guardian:latest
            ${{ env.IMAGE_PREFIX }}/medipaw-guardian:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Vet Frontend ────────────────────────────────────────────────
      - name: Build & Push vet
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ai/docker/Dockerfile.vet
          push: true
          build-args: |
            VITE_API_BASE_URL=http://localhost:8000
          tags: |
            ${{ env.IMAGE_PREFIX }}/medipaw-vet:latest
            ${{ env.IMAGE_PREFIX }}/medipaw-vet:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
